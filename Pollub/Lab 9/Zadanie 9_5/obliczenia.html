<!DOCTYPE html>

    <link rel="stylesheet" href="CSS/style.css" type="text/css">
    <script src="JS/funkcje.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <div id="baner">
        <h2>Szybki kurs HTML</h2>
    </div>
    <div id="menu">
        <ul id="nav">
            <li><a href="index.html">Podstawy</a></li>
            <li><a href="tabele.html">Tabele</a></li>
            <li><a href="">Formularze</a>

                    <li><a href="formularze.html" >Pola formularza</a></li>

                </ul>
            </li>
            <li><a href="galeria.html">Galeria</a></li>
        </ul>
    </div>
    <div id="tresc">
        <h3>Pozyczka</h3>
        <table>
            <tr>
                <td><label for="kwotapozyczki">Kwota: </label></td>
                <td><input type="number" min="0" id="kwotapozyczki" name="kwotapozyczki"/></td>
            </tr>
            <tr>
                <td><label for="oprocroczne">Ile rat: </label></td>
                <td><input type="number" name="oprocroczne" id="oprocroczne" min="0"/></td>
            </tr>
            <tr>
                <td><label for="liczbarat">Procent: </label></td>
                <td><input type="number" name="liczbarat" id="liczbarat" min="1"/></td>
            </tr>
            <tr>
                <td><label for="oprocroczniewskm" class="zielony">Rata miesięcna: </label></td>
                <td><input type="text" name="oprocroczniewskm" id="oprocroczniewskm" disabled/></td>
            </tr>
            <tr>
                <td><label for="wynik" class="zielony">Kwota z odsetkami: </label></td>
                <td><input type="text" name="wynik" id="wynik" disabled/></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center; vertical-align: middle;"><button>Oblicz ratę stałą</button></td>
            </tr>
        </table>
    </div>
    <div id="pasek">
        <div class="box">
            <h3>Walidatory:</h3>
            <ul>
                <li><a href="http://validator.w3.org/">HTML</a></li>
                <li><a href="http://jigsaw.w3.org/css-validator/">CSS</a></li>
            </ul>
        </div>
        <div class="box">
            <h3>Kursy:</h3>
            <ul>
                <li><a href="https://www.w3schools.com/html/"> HTML </a></li>
                <li><a href="https://www.w3schools.com/css/"> CSS </a></li>
                <li><a href="https://www.w3schools.com/js/"> JS </a></li>
                <li><a href="https://www.w3schools.com/php/"> PHP </a></li>
            </ul>
        </div>
    </div>
    <div id="stopka"> &copy;BP</div>

    <script>
        $(function () {
            $('#tresc').css('background-color', 'gray');
            $('label').css('font-weight', 'bold');
            $('.zielony').css('background-color', 'green');
            $('button').click(function () {
                funkcja();
            });
        });
    </script>
</body>
</html>
