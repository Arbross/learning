<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koszyk produktów</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>Formularz produktu</h2>
    <form id="productForm">
        <label>Nazwa produktu: <input type="text" id="nazwa" required /></label><br>
        <label>Cena: <input type="number" id="cena" required /></label><br>
        <label>Kolor: <input type="text" id="kolor" required /></label><br>
        <label>Liczba sztuk: <input type="number" id="liczba" required></label><br>

        <button type="button" onclick="zapiszDoKoszyka()">Zapisz produkt do koszyka</button>
        <button type="button" onclick="wyswietlKoszyk()">Wyświetl koszyk</button>
        <button type="button" onclick="usunDaneZKoszyka()">Usuń wszystkie produkty</button>
    </form>
    
    <h2>Wyszukaj produkt</h2>
    <input type="text" id="search" placeholder="Szukaj po nazwie..." oninput="wyswietlKoszyk()">
    
    <h2>Koszyk</h2>
    <div id="koszyk"></div>
    
    <script>
        function zapiszDoKoszyka() {
            let product = {
                nazwa: document.getElementById("nazwa").value,
                cena: document.getElementById("cena").value,
                kolor: document.getElementById("kolor").value,
                liczba: document.getElementById("liczba").value
            };
            
            let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];
            koszyk.push(product);
            localStorage.setItem("koszyk", JSON.stringify(koszyk));
            alert("Produkt zapisany do koszyka!");
            wyswietlKoszyk();
        }
        
        function wyswietlKoszyk() {
            let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];
            let koszykDiv = document.getElementById("koszyk");
            let searchQuery = document.getElementById("search").value.toLowerCase();
            koszykDiv.innerHTML = "";
            
            if (koszyk.length === 0) {
                koszykDiv.innerHTML = "Koszyk jest pusty.";
                return;
            }
            
            let table = '<table><tr><th>Nazwa</th><th>Cena</th><th>Kolor</th><th>Liczba sztuk</th><th>Akcje</th></tr>';
            koszyk.forEach((item, index) => {
                if (item.nazwa.toLowerCase().includes(searchQuery)) {
                    table += `<tr>
                                <td>${item.nazwa}</td>
                                <td>${item.cena}</td>
                                <td>${item.kolor}</td>
                                <td>${item.liczba}</td>
                                <td>
                                    <button onclick="edytowanieProduktu(${index})">Edytuj</button>
                                    <button onclick="usunProdukt(${index})">Usuń</button>
                                </td>
                              </tr>`;
                }
            });
            
            table += '</table>';
            koszykDiv.innerHTML = table;
        }
        
        function usunProdukt(index) {
            let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];
            koszyk.splice(index, 1);
            localStorage.setItem("koszyk", JSON.stringify(koszyk));
            wyswietlKoszyk();
        }
        
        function edytowanieProduktu(index) {
            let koszyk = JSON.parse(localStorage.getItem("koszyk")) || [];
            let product = koszyk[index];

            document.getElementById("nazwa").value = product.nazwa;
            document.getElementById("cena").value = product.cena;
            document.getElementById("kolor").value = product.kolor;
            document.getElementById("liczba").value = product.liczba;

            usunProdukt(index);
        }
        
        function usunDaneZKoszyka() {
            localStorage.removeItem("koszyk");
            wyswietlKoszyk();
            alert("Wszystkie produkty zostały usunięte.");
        }
    </script>
</body>
</html>
