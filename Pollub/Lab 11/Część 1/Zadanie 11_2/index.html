<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalStorage</title>
    <script src="JS/funkcje.js"></script>
</head>
<body>
    <h3>Test localStorage</h3>
    <form>
        Kod koloru: <input type="text" name="rgb" id="rgb" placeholder="Wprowadz kod RGB"/>, nazwa koloru: 
        <input type="text" name="nazwa" id="nazwa" placeholder="Wprowadz nazwę"/> <br> <br>

        <button type="submit" onclick="zapiszPare(event)">Zapisz parę</button>
        <button type="submit" onclick="pokazDane(event)">Pokaz wszystkie pary</button>
        <button type="submit" onclick="usunDane(event)">Usuń dane</button>
    </form>
    <h3>Dane z localStorage;</h3>
    <div id="list"></div>

    <!--
                localStorage	                                            sessionStorage
    Trwałość	Dane są trwałe, zostają po zamknięciu przeglądarki	        Dane są tymczasowe, usuwane po zamknięciu przeglądarki
    Dostępność	Dostępne we wszystkich kartach i oknach tej samej domeny	Dostępne tylko w tej samej karcie (tabie)
    -->

</body>
</html>
