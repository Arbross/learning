<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SessionStorage</title>
    <script src="JS/funkcje.js"></script>
</head>
<body>
    <h3>Test sessionStorage</h3>
    <form>
        Kod koloru: <input type="text" name="rgb" id="rgb" placeholder="Wprowadz kod RGB"/>, nazwa koloru: 
        <input type="text" name="nazwa" id="nazwa" placeholder="Wprowadz nazwę"/> <br> <br>

        <button type="submit" onclick="zapiszPare(event)">Zapisz parę</button>
        <button type="submit" onclick="pokazDane(event)">Pokaz wszystkie pary</button>
        <button type="submit" onclick="usunDane(event)">Usuń dane</button>
    </form>
    <h3>Dane z sessionStorage;</h3>
    <div id="list"></div>

    <!--
    - sessionStorage przechowuje dane tylko dla jednej sesji przeglądarki.
    - Jeśli uzytkownik odświeży stronę – dane pozostają.
    - Jeśli uzytkownik zamknie i otworzy przeglądarkę ponownie – dane zostają usunięte.
    - Jeśli uzytkownik otworzy nową kartę (ale nie zamknie poprzedniej), dane nie są automatycznie kopiowane do nowej karty.
    -->

</body>
</html>
