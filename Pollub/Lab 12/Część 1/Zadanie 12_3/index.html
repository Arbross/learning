<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koszyk produktów</title>
  <style>
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h2>Formularz produktu</h2>
  <form id="productForm">
    <label>Nazwa produktu: <input type="text" id="nazwa" required /></label><br>
    <label>Cena: <input type="number" id="cena" required /></label><br>
    <label>Kolor: <input type="text" id="kolor" required /></label><br>
    <label>Liczba sztuk: <input type="number" id="liczba" required></label><br>

    <button type="button" onclick="dodajProdukt()">Zapisz produkt do koszyka</button>
    <button type="button" onclick="wyswietlKoszyk()">Wyświetl koszyk</button>
    <button type="button" onclick="usunKoszyk()">Usuń wszystkie produkty</button>
  </form>
  
  <h2>Koszyk</h2>
  <div id="koszyk"></div>
  
  <script>
    class Organizer {
      static koszyk = [];

      static pobierzKoszyk() {
        const stored = localStorage.getItem('koszyk');
        Organizer.koszyk = stored ? JSON.parse(stored) : [];
      }

      static dodajProdukt() {
        const produkt = {
          nazwa: document.getElementById("nazwa").value,
          cena: document.getElementById("cena").value,
          kolor: document.getElementById("kolor").value,
          liczba: document.getElementById("liczba").value
        };
        Organizer.koszyk.push(produkt);
        localStorage.setItem('koszyk', JSON.stringify(Organizer.koszyk));
        alert("Produkt zapisany do koszyka!");
      }

      static wyswietlKoszyk() {
        const koszykDiv = document.getElementById("koszyk");
        if (Organizer.koszyk.length === 0) {
          koszykDiv.innerHTML = "Koszyk jest pusty.";
          return;
        }
        let table = `<table>
                       <tr>
                         <th>Nazwa</th>
                         <th>Cena</th>
                         <th>Kolor</th>
                         <th>Liczba sztuk</th>
                       </tr>`;
        Organizer.koszyk.forEach((item) => {
          table += `<tr>
                      <td>${item.nazwa}</td>
                      <td>${item.cena}</td>
                      <td>${item.kolor}</td>
                      <td>${item.liczba}</td>
                    </tr>`;
        });
        table += `</table>`;
        koszykDiv.innerHTML = table;
      }

      static usunKoszyk() {
        localStorage.removeItem('koszyk');
        Organizer.koszyk = [];
        Organizer.wyswietlKoszyk();
        alert("Wszystkie produkty zostały usunięte.");
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      Organizer.pobierzKoszyk();
    });

    function dodajProdukt() {
      Organizer.dodajProdukt();
    }

    function wyswietlKoszyk() {
      Organizer.wyswietlKoszyk();
    }

    function usunKoszyk() {
      Organizer.usunKoszyk();
    }
  </script>
</body>
</html>
