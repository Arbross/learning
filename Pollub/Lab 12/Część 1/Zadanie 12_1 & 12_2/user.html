<!DOCTYPE html>
<html>
    <head>
        <title>Formularz rejestracji</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script>
            class User {
                constructor(email = "", login = "user", pass = "user") {
                    this.login = login;
                    this.pass = pass;
                    this.email = email;
                }

                pokaz() {
                    return 'Dane użytkownika:\nLogin: ' + this.login + '\nPassword: ' + this.pass + '\nEmail: ' + this.email;
                }

                formularzRejestracji(){
                    var formularz = "";
                    formularz += '<form id="formaRegistracji">Email: <input type="email" name="email" id="email"/> <br>';
                    formularz += 'Login: <input type="text" name="login" id="login"/> <br>';
                    formularz += 'Hasło: <input type="password" name="password" id="password"/> <br>';
                    formularz += '<button type="submit">Zarejestruj</button></form>';
                    return formularz;
                }
            }
            
            document.addEventListener("DOMContentLoaded", () => {
                var user = new User("Email", "Login", "Pass");
                console.log(user.pokaz());

                var formularz = document.getElementById("formularz");
                formularz.innerHTML = user.formularzRejestracji();

                document.getElementById("formaRegistracji").addEventListener("submit", (e) => {
                    e.preventDefault();

                    const email = document.getElementById("email").value;
                    const login = document.getElementById("login").value;
                    const password = document.getElementById("password").value;

                    for (let i = 0; i < localStorage.length; i++) {
                        const user = JSON.parse(localStorage.getItem(localStorage.key(i)));

                        if (user.login == login || user.email == email) {
                            document.getElementById("info").innerHTML += 'Istnieje już użytkownik o podanym loginie lub adresie e-mail. <br>';
                            return;
                        }
                    }

                    const newUser = new User(email, login, password);
                    localStorage.setItem(login, JSON.stringify(newUser));

                    document.getElementById("info").innerHTML += "Zarejestrowano użytkownika:<br>" + newUser.pokaz() + '<br>';
                });
            });
        </script>
    </head>
    <body>
        <div>
          <h2>Rejestracja nowego użytkownika w localStorage</h2>
          <div id="formularz"></div>
          <div id="info"></div>
        </div>
    </body>
</html>
