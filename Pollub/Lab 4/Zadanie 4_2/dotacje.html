<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dotacja</title>
</head>
<body>
    <h1>Formularz dotacji</h1>
    <form action="#" method="post">
        <fieldset> 
            <label for="beneficiary">Beneficjent: </label>
            <input list="beneficiaries" name="beneficiary" id="beneficiary" title="Podaj beneficjenta lub wybierz z podanych" required>
            <datalist id="beneficiaries">
                <option value="Organizacja 1">
                <option value="Organizacja 2">
                <option value="Organizacja 3">
                <option value="Organizacja 4">
                <option value="Organizacja 5">
            </datalist> <br/>

            <label for="dotationsize">Wartość dotacji: </label>
            <input type="number" name="dotationsize" id="dotationsize" min="20" step="1" title="Podaj wartość dotacja. Musi być większa od 20" required/>
        </fieldset>
        <fieldset>
            <legend>Dane karty płatniczej</legend>
            <label>Karta: </label>
            <input type="radio" name="paymenttype" id="visa" title="Zaznacz typ płatności" required/> Visa
            <input type="radio" name="paymenttype" id="mastercard" title="Zaznacz typ płatności" required/> Master Card <br/>

            <label for="number">Number: </label>
            <input type="text" name="number" id="number" pattern="^\d{13}$|^\d{16}$" inputmode="numeric" title="Podaj number karty: 16 lub 13 cyfr" required/> <br/>

            <label for="date">Data wazności: </label>
            <input type="date" name="date" id="date" title="Podaj datę wazności karty" required/> <br/>

            <label for="cvv">Kod CVV: </label>
            <input type="text" name="cvv" id="cvv" pattern="^\d{3}$|^\d{4}$" title="Podaj 3 lub 4 cyfrowy kod CVV" inputmode="numeric" required/>
        </fieldset>
        Darczyńca: 
        <input type="text" name="donor" id="donor" pattern="^\d{3}$" title="Podaj 3 symbole kodu darczyńcy" required/> <br/>
        <button type="submit">Rejestruj</button>
        <button type="reset">Wyczyść</button>
    </form>
</body>
</html>
